# ============================================================
# 自动化比价系统配置
# ============================================================

project:
  name: "麦德龙周比价"
  # 我方（基准方）名称，报告中作为对比基准
  self_name: "麦德龙"

# ------------------------------------------------------------
# 采集层：RPA 工具对接
# 项目本身不写爬虫，采集交给影刀 / UiPath / Coze / 八爪鱼。
# 三种对接方式任选，数据契约见 docs/ingest-contract.md
# ------------------------------------------------------------
ingest:
  # A. 文件落盘：RPA 跑完导出 CSV/Excel 到该目录，程序扫描导入（最稳，推荐起步）
  inbox_dir: "data/inbox"
  archive_dir: "data/raw"      # 导入后归档原始文件，便于追溯
  encoding: "utf-8-sig"        # 兼容 Excel 导出的 BOM

  # B. HTTP 回调：起一个接收服务，RPA 流程末尾加「发送 HTTP 请求」推数据过来
  #    注意：影刀 OpenAPI 没有主动回调，必须在机器人流程最后一步主动 POST
  http:
    enabled: false
    host: "127.0.0.1"
    port: 8770
    token: ""                  # 留空则不校验；生产环境务必设置

  # C. 主动拉取：我方调 RPA 厂商 OpenAPI 触发任务并轮询结果
  yingdao:
    enabled: false
    base_url: "https://api.yingdao.com"
    access_key_id: ""          # 建议用环境变量 YINGDAO_ACCESS_KEY_ID 覆盖
    access_key_secret: ""      # 建议用环境变量 YINGDAO_ACCESS_KEY_SECRET 覆盖
    robot_uuid: ""
    schedule_uuid: ""
    poll_interval_sec: 10
    poll_timeout_sec: 1800

# ------------------------------------------------------------
# 竞品平台
# ------------------------------------------------------------
competitors:
  - key: "sams"
    name: "山姆"
  - key: "rtmart"
    name: "大润发"
  - key: "walmart"
    name: "沃尔玛"
  - key: "freshhema"
    name: "盒马"

# ------------------------------------------------------------
# 规格解析与折算
# 比价必须落在「可比单位价」上，否则 500ml×6 和 1.5L 没法比
# ------------------------------------------------------------
spec:
  # 折算基准单位：重量按每 100g，体积按每 100ml，计数类按每件
  base_weight_g: 100
  base_volume_ml: 100
  # 解析失败时是否仍参与比价（仅比标价，报告中标注告警）
  allow_unparsed: true

# ------------------------------------------------------------
# 商品匹配：分层策略 L1 硬规则 → L2 模糊召回 → L3 LLM 兜底
# ------------------------------------------------------------
matching:
  # L1 硬规则：条码命中即直接确认，不再往下走
  rules:
    enable_barcode: true
    # 品牌 + 品类 + 规格三者一致，视为强匹配
    enable_brand_spec: true

  # L2 模糊召回
  fuzzy:
    top_k: 5                   # 每个我方商品召回几个候选
    auto_accept: 88            # ≥ 该分数直接接受，不调 LLM
    reject_below: 55           # < 该分数直接丢弃，不调 LLM
    # 55 ~ 88 之间为「灰区」，交给 L3 判定
    # 规格差异惩罚：单位价差异越大，相似度扣分越多
    spec_mismatch_penalty: 12

  # L3 LLM 兜底：只处理灰区候选，成本可控
  llm:
    enabled: true              # 未配置 ANTHROPIC_API_KEY 时自动降级为跳过
    model: "claude-opus-5"
    batch_size: 20             # 每次请求打包多少组候选
    max_concurrency: 4
    accept_confidence: 0.7     # LLM 置信度低于此值转人工复核

  # 人工复核：低置信匹配导出成单独清单，对应原方案的「人工2次确认」
  review:
    export_path: "data/output/待人工复核.csv"

# ------------------------------------------------------------
# 比价规则
# ------------------------------------------------------------
compare:
  # 价差率 = (我方单位价 - 竞品单位价) / 竞品单位价
  # 正数 = 我方更贵
  thresholds:
    critical_high: 0.15        # 我方贵出 15% 以上 → 建议降价（高优）
    warn_high: 0.05            # 贵出 5%~15%      → 关注
    warn_low: -0.10            # 便宜 10% 以上     → 有提价空间
  # 多个竞品时，取哪个作为跟价基准
  benchmark: "min"             # min=最低价竞品 | avg=竞品均价 | 指定 key 如 "sams"

# ------------------------------------------------------------
# 输出
# ------------------------------------------------------------
report:
  output_dir: "data/output"
  html_name: "比价报告.html"
  top_n: 20                    # 报告中价差 TOP N
